<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Login - DAN TECH</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #2563eb 100%);
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: rgba(255,255,255,0.04);
      border-radius: 18px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      padding: 2.5rem 2rem 2rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1.5px solid rgba(37,99,235,0.12);
      backdrop-filter: blur(8px);
    }
    .login-container h2 {
      color: #2563eb;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .login-container p {
      color: #bcd0ee;
      font-size: 1.08rem;
      margin-bottom: 2rem;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .form-group {
      text-align: left;
    }
    .form-label {
      color: #e0e7ef;
      font-weight: 600;
      margin-bottom: 0.4rem;
      display: block;
      font-size: 1rem;
    }
    .form-input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1.5px solid #2563eb33;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      margin-bottom: 0.2rem;
      transition: border 0.2s;
    }
    .form-input:focus {
      outline: none;
      border: 1.5px solid #2563eb;
      background: rgba(37,99,235,0.08);
    }
    .login-btn {
      background: linear-gradient(90deg, #2563eb 0%, #0ea5e9 100%);
      color: #fff;
      font-weight: 700;
      font-size: 1.08rem;
      border: none;
      border-radius: 999px;
      padding: 0.9rem 2.2rem;
      margin-top: 0.5rem;
      cursor: pointer;
      box-shadow: 0 2px 16px 0 rgba(14, 165, 233, 0.10), 0 1.5px 8px #2563eb33;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.18s;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7em;
    }
    .login-btn:active {
      transform: scale(0.98);
    }
    .login-btn i {
      font-size: 1.1em;
    }
    .login-error {
      color: #ef4444;
      background: rgba(239,68,68,0.08);
      border: 1px solid #ef4444;
      border-radius: 6px;
      padding: 0.7em 1em;
      margin-bottom: 0.7em;
      font-size: 0.98em;
      display: none;
    }
    .login-success {
      color: #22c55e;
      background: rgba(34,197,94,0.08);
      border: 1px solid #22c55e;
      border-radius: 6px;
      padding: 0.7em 1em;
      margin-bottom: 0.7em;
      font-size: 0.98em;
      display: none;
    }
    .form-note {
      color: #bcd0ee;
      font-size: 0.95em;
      margin-top: 0.2em;
    }
    @media (max-width: 500px) {
      .login-container {
        padding: 1.2rem 0.5rem 1.5rem 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Staff Portal</h2>
    <p>Access your workspace dashboard and resources</p>
    <form class="login-form" id="staffLoginForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="staffId">Staff ID</label>
        <input type="text" id="staffId" class="form-input" placeholder="Enter your staff ID" required autofocus />
        <div class="form-note">Username: <b>DAN</b></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter your password" required />
      </div>
      <div class="login-error" id="loginError">Invalid Staff ID or Password. Please try again.</div>
      <div class="login-success" id="loginSuccess">Login successful! Redirecting...</div>
      <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
    </form>
  </div>
  <script>
    document.getElementById('staffLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const staffId = document.getElementById('staffId').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      const successDiv = document.getElementById('loginSuccess');
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      if (staffId.toUpperCase() === 'DAN' && password === 'Danny1@ke') {
        successDiv.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1200);
      } else {
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
